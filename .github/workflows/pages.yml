name: Publish dashboard

# Rebuilds the static dashboard with fresh prices and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes during US market hours (13:30–20:00 UTC covers EDT and EST)...
    - cron: '*/15 13-20 * * 1-5'
    # ...and once after the close so the day's final prices land.
    - cron: '30 21 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
